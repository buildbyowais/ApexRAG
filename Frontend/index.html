<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexRAG · Intelligent Document Assistant</title>
    <!-- Bootstrap 5.3 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">

            <!-- Brand -->
            <div class="sidebar-brand">
                <i class="bi bi-compass"></i> ApexRAG
            </div>


            <!-- Drag & Drop Dropzone -->
            <div class="dropzone" id="dropzone">
                <i class="bi bi-cloud-arrow-up"></i>

                <p><strong>Upload document</strong></p>
                <p class="small">PDF, DOCX, TXT · max 20MB</p>

                <input type="file" id="fileInput" accept=".pdf,.docx,.txt" style="display:none;">
            </div>


            <!-- File info & progress -->
            <div id="fileInfoArea">

                <div class="file-info d-none" id="fileInfo">
                    <div class="fname" id="fileName">
                        document.pdf
                    </div>

                    <div class="fmeta" id="fileMeta">
                        2.4 MB · uploaded just now
                    </div>
                </div>


                <div class="upload-progress d-none" id="progressWrap">
                    <div class="bar" id="progressBar" style="width:0%;"></div>
                </div>


                <div id="uploadStatus" class="small text-muted mt-1"></div>

            </div>


            <!-- Upload Button -->
            <button class="btn btn-upload" id="uploadBtn">
                <i class="bi bi-upload me-1"></i>
                Upload
            </button>


            <hr class="my-3">


            <!-- Document Status -->
            <div class="d-flex justify-content-between align-items-center">

                <span class="status-badge">
                    <i class="bi bi-circle-fill" style="color:#14b8a6;font-size:0.5rem;"></i>
                    Ready
                </span>

                <span id="docIdBadge" class="text-secondary" style="font-size:0.7rem;">
                    No document
                </span>

            </div>


            <!-- Info -->
            <div class="mt-2 text-secondary" style="font-size:0.75rem;">
                <i class="bi bi-info-circle"></i>
                Upload a document to start chatting
            </div>


            <!-- GitHub -->
            <div class="github-link">

                <a href="https://github.com/buildbyowais" target="_blank" rel="noopener noreferrer"
                    title="GitHub - @buildbyowais">
                    <i class="bi bi-github"></i>
                </a>

            </div>

        </aside>

        <!-- MAIN CHAT -->
        <main class="chat-main">
            <div class="chat-header">
                <h5><i class="bi bi-chat-dots me-2"></i>Chat</h5>
                <button class="btn btn-sm btn-outline-secondary" id="clearChatBtn"><i class="bi bi-eraser"></i>
                    Clear</button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty-chat" id="emptyMessage">
                    <i class="bi bi-file-earmark-plus"></i>
                    Upload a document to start asking questions.
                </div>
            </div>

            <div class="chat-footer">
                <div class="input-group">
                    <input type="text" class="form-control" id="questionInput" placeholder="Ask a question..." disabled>
                    <button class="btn" id="sendBtn" disabled>
                        <span id="sendLabel"><i class="bi bi-send-fill"></i> Send</span>
                        <span id="sendSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </div>
                <div class="mt-1 text-end text-secondary" style="font-size:0.7rem;" id="inputHelper">Upload a document
                    first</div>
            </div>
        </main>
    </div>

    <!-- Toast container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastBody">Error message</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
